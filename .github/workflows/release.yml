name: Release PITHA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-firmware:
    runs-on: ubuntu-22.04
    container:
      image: infinitime/infinitime-build
    env:
      SOURCES_DIR: .
    steps:
      - name: Checkout source files
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Install resource build dependencies
        run: |
          apt-get update
          apt-get -y install --no-install-recommends python3-pil
      - name: Build firmware and DFU archives
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          /opt/build.sh all
      - name: Upload release firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-firmware
          path: |
            ./build/output/pinetime-mcuboot-app-dfu-*.zip
            ./build/output/pinetime-mcuboot-app-image-*.bin
            ./build/output/infinitime-resources-*.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout integration source
        uses: actions/checkout@v4
      - name: Download firmware artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-firmware
          path: release-assets
      - name: Package Home Assistant integration
        run: |
          zip -r "release-assets/pitha-homeassistant-${GITHUB_REF_NAME}.zip" custom_components/pinetime
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
